# merge-gate: hands-off merging for pull requests into main.
#
# What it does, in order:
# 1. Holds for the human owner any pull request that
#    - is marked [RED] in its title or description, or
#    - changes any path listed in .github/CODEOWNERS (read from main, never
#      from the pull request), or anything under .github/.
#    Those never merge automatically. If the gate cannot read CODEOWNERS or
#    the changed-file list, it holds the pull request (fails closed).
# 2. Turns on auto-merge (squash) for pull requests from branches inside
#    this repository. Pull requests from forks are never auto-merged.
# 3. Waits until every other check on the pull request has finished and
#    fails if any of them failed.
#
# The organization ruleset on main requires this "merge-gate" check, so a
# pull request merges only when this job passes.
#
# Security note: this runs on pull_request_target, so GitHub always uses
# the copy of this file on main, never a copy edited inside a pull request.
# It never checks out or runs pull request code. The title and description
# are passed in as environment variables, never pasted into the script.

name: merge-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Public repositories only; on private repositories this needs a paid
    # GitHub Advanced Security licence.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Hold [RED] pull requests and owner-only files
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Any error in this step fails the step, which holds the pull request.
          set -euo pipefail

          # 1. Anything marked [RED] always needs the owner.
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -qF '[RED]'; then
            echo "::error::This pull request is marked [RED] and needs the owner to merge it."
            exit 1
          fi

          # 2. Owner-only paths come from CODEOWNERS on the base branch (main),
          #    so a pull request can never loosen its own rules.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_REF" > "$RUNNER_TEMP/CODEOWNERS"

          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if [ ! -s "$RUNNER_TEMP/files.txt" ]; then
            echo "::error::Could not read the list of changed files, so this pull request is held for the owner."
            exit 1
          fi

          python3 - "$RUNNER_TEMP/CODEOWNERS" "$RUNNER_TEMP/files.txt" <<'PY'
          import re
          import sys

          def to_regex(pattern):
              anchored = pattern.startswith("/") or "/" in pattern.rstrip("/")
              is_dir = pattern.endswith("/")
              p = pattern.strip("/")
              out, i = "", 0
              while i < len(p):
                  if p.startswith("**", i):
                      out += ".*"
                      i += 2
                  elif p[i] == "*":
                      out += "[^/]*"
                      i += 1
                  elif p[i] == "?":
                      out += "[^/]"
                      i += 1
                  else:
                      out += re.escape(p[i])
                      i += 1
              prefix = "^" if anchored else "^(?:.*/)?"
              suffix = "/.*$" if is_dir else "(?:/.*)?$"
              return re.compile(prefix + out + suffix)

          rules = []
          with open(sys.argv[1], encoding="utf-8") as fh:
              for line in fh:
                  parts = line.split("#", 1)[0].split()
                  if len(parts) >= 2:
                      rules.append(to_regex(parts[0]))
          if not rules:
              print("::error::CODEOWNERS on main has no owner rules, so this pull request is held for the owner.")
              sys.exit(1)

          with open(sys.argv[2], encoding="utf-8") as fh:
              files = [f.strip() for f in fh if f.strip()]
          if not files:
              print("::error::Could not read the list of changed files, so this pull request is held for the owner.")
              sys.exit(1)
          always = re.compile(r"^\.github/|(^|/)CODEOWNERS$")
          hits = sorted({f for f in files if always.search(f) or any(r.match(f) for r in rules)})
          if hits:
              print("::error::This pull request changes owner-only files and needs the owner to merge it:")
              print("\n".join(hits))
              sys.exit(1)
          print(f"Checked {len(files)} file(s) against {len(rules)} owner rule(s): none are owner-only.")
          PY

      - name: Turn on auto-merge
        if: env.SAME_REPO == 'true' && env.IS_DRAFT != 'true'
        run: gh pr merge --auto --squash "$PR_URL" || echo "::warning::Could not turn on auto-merge."

      - name: Wait for every other check to pass
        run: |
          set -euo pipefail
          sleep 60
          stable=0
          for i in $(seq 1 140); do
            runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name != "merge-gate") | [.name, .status, (.conclusion // "")] | @tsv')
            statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | [.context, .state] | @tsv')

            failed=$( { printf '%s\n' "$runs" | awk -F'\t' '$3 ~ /^(failure|cancelled|timed_out|action_required|stale)$/ {print $1" ("$3")"}';
                        printf '%s\n' "$statuses" | awk -F'\t' '$2 ~ /^(failure|error)$/ {print $1" ("$2")"}'; } )
            pending=$( { printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed" {print $1}';
                         printf '%s\n' "$statuses" | awk -F'\t' '$2 == "pending" {print $1}'; } )

            if [ -n "$failed" ]; then
              echo "::error::These checks failed:"
              printf '%s\n' "$failed"
              exit 1
            fi
            if [ -z "$pending" ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then
                echo "All checks passed."
                exit 0
              fi
            else
              stable=0
              echo "Waiting on: $(printf '%s ' $pending)"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for checks."
          exit 1
