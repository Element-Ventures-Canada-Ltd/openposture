# Handling: Unclassified — working
#
# merge-gate: hands-off merging for pull requests into main.
#
# What it does, in order:
# 1. Classifies the pull request with .github/scripts/red_zone_gate.py from
#    main (red = a CODEOWNERS path, anything under .github/, or [RED] in the
#    title or description; a pull request matching an automation lane in
#    .github/automation-lanes.json on main is green). Red does NOT fail this check: red pull requests
#    wait on the separate `owner-approval` status instead (see red-zone.yml
#    and owner-approval.yml). This step fails only on real errors, such as
#    being unable to read CODEOWNERS or the changed-file list.
# 2. Turns on auto-merge (squash) for green pull requests from branches
#    inside this repository. Red pull requests get auto-merge only when the
#    owner approves them. Pull requests from forks are never auto-merged.
# 3. Waits until every other check on the pull request has finished and
#    fails if any of them failed. `owner-approval` is left out of this wait:
#    it is pending on purpose until the owner acts, and it is required by
#    the ruleset on its own.
#
# The organization ruleset on main requires this "merge-gate" check; the
# repository ruleset requires "owner-approval".
#
# Security note: this runs on pull_request_target, so GitHub always uses
# the copy of this file on main, never a copy edited inside a pull request.
# It checks out main only and never checks out or runs pull request code.
# The title and description are read from the API inside the script, never
# pasted into a shell. Actions are pinned to full commit SHAs.

name: merge-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # Public repositories only; on private repositories this needs a paid
    # GitHub Advanced Security licence.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      IS_DRAFT: ${{ github.event.pull_request.draft }}
    steps:
      - name: Checkout base branch (never the pull request)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Classify red or green
        id: zone
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FEEDS_PAUSED: ${{ vars.FEEDS_PAUSED }}
        run: python3 .github/scripts/red_zone_gate.py classify

      - name: Turn on auto-merge (green pull requests only)
        if: steps.zone.outputs.red == 'false' && env.SAME_REPO == 'true' && env.IS_DRAFT != 'true'
        run: gh pr merge --auto --squash "$PR_URL" || echo "::warning::Could not turn on auto-merge."

      - name: Wait for every other check to pass
        run: |
          set -euo pipefail
          sleep 60
          stable=0
          for i in $(seq 1 140); do
            runs=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100" --paginate \
              --jq '.check_runs[] | select(.name != "merge-gate") | [.name, .status, (.conclusion // "")] | @tsv')
            statuses=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '.statuses[] | select(.context != "owner-approval") | [.context, .state] | @tsv')

            failed=$( { printf '%s\n' "$runs" | awk -F'\t' '$3 ~ /^(failure|cancelled|timed_out|action_required|stale)$/ {print $1" ("$3")"}';
                        printf '%s\n' "$statuses" | awk -F'\t' '$2 ~ /^(failure|error)$/ {print $1" ("$2")"}'; } )
            pending=$( { printf '%s\n' "$runs" | awk -F'\t' 'NF && $2 != "completed" {print $1}';
                         printf '%s\n' "$statuses" | awk -F'\t' '$2 == "pending" {print $1}'; } )

            if [ -n "$failed" ]; then
              echo "::error::These checks failed:"
              printf '%s\n' "$failed"
              exit 1
            fi
            if [ -z "$pending" ]; then
              stable=$((stable + 1))
              if [ "$stable" -ge 2 ]; then
                echo "All checks passed."
                exit 0
              fi
            else
              stable=0
              echo "Waiting on: $(printf '%s ' $pending)"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for checks."
          exit 1
